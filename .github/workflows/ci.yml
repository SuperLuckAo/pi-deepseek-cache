name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pi 1.2.x declares engines.node ">=22.19.0" and its dist imports
      # fs.globSync (Node 22.14+), so Node 20 fails with
      # "does not provide an export named 'globSync'" as soon as the
      # extension imports @earendil-works/pi-coding-agent.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Audit (moderate+)
        run: npm audit --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test
